                'line-width': 3,
                'line-dasharray': [4, 2],
                'line-opacity': 0.8
            }

        function makeDirectLink(url) {
            if (!url) return null;
            let cleanLink = url.trim();
            let idMatch = cleanLink.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
            if (idMatch && idMatch[1]) {
                return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
            }
            return cleanLink;
        }

        map.on('click', 'network-points', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const props = e.features[0].properties;
            const category = props.category;
            
            map.flyTo({ center: coordinates, speed: 1.2, offset: [-200, 0] });
            document.getElementById('back-btn').style.display = 'none';

            let panelHTML = '';

            if (category.startsWith('personal-profile')) {
                let heroImage = `[ Self Portrait / Profile Photograph ]`;
                if (props.profile_image) {
                    let directHero = makeDirectLink(props.profile_image);
                    heroImage = `<img src="${directHero}" style="width: 100%; height: 100%; object-fit: cover;" alt="Self Portrait">`;
                }

                let thumb1 = `[ Context Image 1 ]`;
                let thumb2 = `[ Context Image 2 ]`;
